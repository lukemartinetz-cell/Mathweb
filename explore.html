<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Explorer · Commutative Algebra</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #d0d0d0; font-family: system-ui, sans-serif; }
#canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#canvas:active { cursor: grabbing; }

#fog {
  position: fixed; inset: 0; pointer-events: none; z-index: 4;
  background: radial-gradient(ellipse at center,
    transparent 22%, rgba(208,208,208,0.32) 55%, rgba(208,208,208,0.91) 100%);
}

.orbit-ring { fill: none; stroke: #ccc; stroke-width: 0.5; }

.conn          { fill: none; }
.conn-required { stroke: #555; stroke-width: 1;   opacity: 0.45; }
.conn-enriches { stroke: #999; stroke-width: 0.8; opacity: 0.45; stroke-dasharray: 5 3; }
.conn-seealso  { stroke: #bbb; stroke-width: 0.5; opacity: 0.6; }
.conn-back     { stroke: #bbb; stroke-width: 0.5; opacity: 0.35; stroke-dasharray: 4 4; }

.node { cursor: pointer; }
.node:hover circle.body { stroke: #534AB7 !important; stroke-width: 2.5 !important; }

/* Full-concept nodes (center + required) — solid black, matches graph full nodes */
.node-center  circle.body { fill: #1a1a1a; stroke: none; }
.node-required circle.body { fill: #1a1a1a; stroke: none; }

/* Supporting nodes — white with border, matches graph stub nodes */
.node-enriches circle.body { fill: #fff; stroke: #c0c0c0; stroke-width: 1.5; stroke-dasharray: 5 3; }
.node-seealso  circle.body { fill: #fff; stroke: #c0c0c0; stroke-width: 1; }
.node-back     circle.body { fill: #b8b8b8; stroke: #333; stroke-width: 2.5; }

.node-stub { opacity: 0.45; }

/* Labels — all dark, sizes matching graph (10 px main, 8.5 px small) */
text.lbl {
  text-anchor: middle;
  pointer-events: none;
  font-family: system-ui, sans-serif;
  font-size: 10px;
  fill: #1a1a1a;
  paint-order: stroke;
  stroke: rgba(208, 208, 208, 0.9);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.node-seealso text.lbl { font-size: 8.5px; fill: #777; }
.node-back    text.lbl { font-size: 10px;  fill: #444; }

#legend {
  position: fixed; bottom: 20px; left: 20px; z-index: 10;
  background: rgba(255,255,255,0.93);
  border: 0.5px solid #ddd; border-radius: 10px;
  padding: 12px 16px; font-size: 12px; color: #1a1a1a; line-height: 1;
  backdrop-filter: blur(6px); user-select: none;
}
.ltitle { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #888; margin-bottom: 10px; }
.lr { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.lr:last-child { margin-bottom: 0; }
.lc { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.lc-ctr { background: #1a1a1a; }
.lc-req { background: #1a1a1a; }
.lc-enr { background: #fff; border: 1.5px dashed #c0c0c0; }
.lc-see { background: #fff; border: 1px solid #c0c0c0; }

#hint {
  position: fixed; bottom: 20px; right: 20px; z-index: 10;
  font-size: 11px; color: #aaa;
  background: rgba(255,255,255,0.82);
  padding: 6px 10px; border-radius: 5px;
  backdrop-filter: blur(4px); user-select: none;
}

#viewnav {
  position: fixed; top: 14px; right: 14px; z-index: 20;
  display: flex; gap: 7px; align-items: center;
}
.vnav {
  font-size: 12px; padding: 4px 13px; border-radius: 99px;
  border: 0.5px solid #ddd; color: #666;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
  text-decoration: none; user-select: none;
}
.vnav:hover { border-color: #555; color: #1a1a1a; }
</style>
</head>
<body>

<svg id="canvas"></svg>
<div id="fog"></div>

<div id="legend">
  <div class="ltitle">Legende</div>
  <div class="lr"><div class="lc lc-ctr"></div><span>Zentrum — Enter öffnet Begriff</span></div>
  <div class="lr"><div class="lc lc-req"></div><span>Required-Referenz</span></div>
  <div class="lr"><div class="lc lc-enr"></div><span>Enriches-Referenz</span></div>
  <div class="lr"><div class="lc lc-see"></div><span>Verwandter Begriff (see-also)</span></div>
</div>

<div id="hint">Scroll to zoom · Drag to pan · Click satellite · ⌫ back · Enter öffnet in App</div>

<div id="viewnav">
  <a id="nav-app"      class="vnav" href="index.html"    target="_blank">App</a>
  <a class="vnav"      href="graph.html"    target="_blank">Graph</a>
  <a id="nav-combined" class="vnav" href="combined.html" target="_blank">Combined</a>
  <a id="nav-tree"     class="vnav" href="tree.html"     target="_blank">Tree</a>
  <a id="nav-learn"    class="vnav" href="learn.html"    target="_blank">Learn</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const R          = { center: 40, required: 22, enriches: 18, seealso: 13, back: 24 };
const ORBIT      = { required: 165, enriches: 285, seealso: 400 };
const BACK_ORBIT = 340;
const DUR        = 800;

let conceptIndex    = {};
let currentId       = null;
let centerX         = 0, centerY = 0;
let currentCameFrom = null;   // unit vector: direction from current center back toward previous
let backStack       = [];     // [{id, cameFrom}] — full navigation history; pop on back
let busy            = false;

const W = window.innerWidth, H = window.innerHeight;
const svg  = d3.select('#canvas').attr('width', W).attr('height', H);
const root = svg.append('g');

const zoom = d3.zoom()
  .scaleExtent([0.1, 6])
  .on('zoom', e => root.attr('transform', e.transform));
svg.call(zoom);
svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2));

const orbitLayer = root.append('g');
const lineLayer  = root.append('g');
const nodeLayer  = root.append('g');

// Arrow markers — one per connector style
const defs = svg.append('defs');
for (const [id, color] of [
  ['arr-required', '#555'],
  ['arr-enriches', '#999'],
  ['arr-seealso',  '#bbb'],
]) {
  defs.append('marker')
    .attr('id',          id)
    .attr('viewBox',     '0 -4 9 8')
    .attr('refX',        9)
    .attr('refY',        0)
    .attr('markerWidth',  5)
    .attr('markerHeight', 5)
    .attr('orient',      'auto')
    .append('path')
      .attr('d',    'M0,-4L9,0L0,4')
      .attr('fill', color);
}

// ── Helpers ───────────────────────────────────────────────────────────────

function isFullConcept(c) {
  return !!(c && c.page && Array.isArray(c.page.blocks) && c.page.blocks.length > 0 && !c.stub);
}
function resolveAlias(id) {
  const c = conceptIndex[id];
  return (c && c.alias_of) ? c.alias_of : id;
}
function nodeR(role) { return R[role] ?? R.seealso; }
function nodeClass(d) {
  if (d.id === '__back__') {
    return `node node-back${!isFullConcept(d.concept) ? ' node-stub' : ''}`;
  }
  const stub = d.role !== 'center' && !isFullConcept(d.concept);
  return `node node-${d.role}${stub ? ' node-stub' : ''}`;
}

// ── Layout ────────────────────────────────────────────────────────────────

function computeLayout(conceptId, cx, cy) {
  const concept = conceptIndex[conceptId];
  if (!concept) return [];
  const refs     = concept.refs ?? [];
  const required = refs.filter(r => r.type === 'required');
  const enriches = refs.filter(r => r.type === 'enriches');
  const related  = concept.page?.related ?? [];

  const nodes = [{ id: conceptId, role: 'center', concept, x: cx, y: cy }];

  const ring = (items, orbit, role, a0 = -Math.PI / 2) => {
    items.forEach((item, i, arr) => {
      const id = typeof item === 'string' ? item : item.id;
      const a  = a0 + (arr.length > 1 ? 2 * Math.PI * i / arr.length : 0);
      nodes.push({ id, role, concept: conceptIndex[id] || null,
        x: cx + Math.round(Math.cos(a) * orbit),
        y: cy + Math.round(Math.sin(a) * orbit) });
    });
  };

  ring(required, ORBIT.required, 'required');
  const ea = required.length > 0
    ? -Math.PI / 2 + Math.PI / Math.max(required.length, 1) * 0.5
    : -Math.PI / 2;
  ring(enriches, ORBIT.enriches, 'enriches', ea);

  related.forEach((item, i, arr) => {
    const id = typeof item === 'string' ? item : item.id;
    const a  = -Math.PI / 2 + (arr.length > 1 ? 2 * Math.PI * i / arr.length : 0);
    const r  = ORBIT.seealso + (i % 2 === 0 ? -22 : 22);
    nodes.push({ id, role: 'seealso', concept: conceptIndex[id] || null,
      x: cx + Math.round(Math.cos(a) * r),
      y: cy + Math.round(Math.sin(a) * r) });
  });

  // Back node: placed in the direction we came from, depth = BACK_ORBIT
  if (backStack.length > 0 && currentCameFrom) {
    const backId = backStack[backStack.length - 1].id;
    nodes.push({
      id: '__back__',
      backTargetId: backId,
      role: 'back',
      concept: conceptIndex[backId] || null,
      x: cx + Math.round(currentCameFrom.x * BACK_ORBIT),
      y: cy + Math.round(currentCameFrom.y * BACK_ORBIT),
    });
  }

  return nodes;
}

// ── Text ─────────────────────────────────────────────────────────────────

function wrapTitle(title, maxC) {
  if (!title || title.length <= maxC) return [title || ''];
  const mid = Math.floor(title.length / 2);
  let cut = title.lastIndexOf(' ', mid + 5);
  if (cut < 2) cut = title.indexOf(' ', mid - 5);
  if (cut < 2) cut = maxC;
  const l2 = title.slice(cut).trim();
  return [title.slice(0, cut).trim(), l2.length > maxC ? l2.slice(0, maxC - 1) + '…' : l2];
}

function applyLabel(sel, d) {
  sel.selectAll('tspan').remove();
  const r = nodeR(d.role);

  if (d.id === '__back__') {
    const title = d.concept?.title || d.backTargetId || '';
    const trunc = title.length > 13 ? title.slice(0, 12) + '…' : title;
    sel.append('tspan').attr('x', 0).attr('dy', r + 14).text('↩ ' + trunc);
    return;
  }

  const maxC  = d.role === 'center' ? 14 : 13;
  const lineH = 15;
  const lines = wrapTitle(d.concept?.title || d.id, maxC);
  const base  = r + (d.role === 'center' ? 16 : 14);
  const dy0   = lines.length > 1 ? base - lineH * 0.45 : base;
  lines.forEach((line, i) =>
    sel.append('tspan').attr('x', 0).attr('dy', i === 0 ? dy0 : lineH).text(line)
  );
}

// ── Core layout applier ───────────────────────────────────────────────────

function applyLayout(layout, t) {
  const cx = layout[0]?.x ?? 0;
  const cy = layout[0]?.y ?? 0;

  // Orbit rings (only around regular satellites, not the back node)
  const regular = layout.filter(d => d.id !== '__back__' && d.role !== 'center');
  const radii = [
    regular.some(d => d.role === 'required') ? ORBIT.required : null,
    regular.some(d => d.role === 'enriches') ? ORBIT.enriches : null,
    regular.some(d => d.role === 'seealso')  ? ORBIT.seealso  : null,
  ].filter(Boolean);

  orbitLayer.selectAll('circle.orbit-ring').data(radii).join(
    e => e.append('circle').attr('class', 'orbit-ring')
           .attr('cx', cx).attr('cy', cy).attr('r', 0)
           .call(s => s.transition(t).attr('r', d => d)),
    u => u.call(s => s.transition(t).attr('cx', cx).attr('cy', cy).attr('r', d => d)),
    x => x.call(s => s.transition(t).attr('r', 0).remove())
  );

  // Connector lines with arrowheads pointing at the satellite
  // (center = dependency, satellite = concept that uses it — matching graph direction)
  const sats = layout.filter(d => d.role !== 'center');

  function connMarker(d) {
    if (d.id === '__back__' || d.role === 'back') return null;
    if (d.role === 'seealso') return 'url(#arr-seealso)';
    if (d.role === 'enriches') return 'url(#arr-enriches)';
    return 'url(#arr-required)';
  }

  // Compute shortened endpoint so arrowhead lands at the circle boundary
  function ex2(d) {
    const dx = d.x - cx, dy = d.y - cy, len = Math.hypot(dx, dy) || 1;
    return d.x - (dx / len) * (nodeR(d.role) + 3);
  }
  function ey2(d) {
    const dx = d.x - cx, dy = d.y - cy, len = Math.hypot(dx, dy) || 1;
    return d.y - (dy / len) * (nodeR(d.role) + 3);
  }

  lineLayer.selectAll('line.conn').data(sats, d => d.id).join(
    e => {
      const l = e.append('line')
        .attr('class', d => `conn conn-${d.id === '__back__' ? 'back' : d.role}`)
        .attr('marker-end', d => connMarker(d))
        .attr('x1', cx).attr('y1', cy).attr('x2', cx).attr('y2', cy)
        .style('opacity', 0);
      l.transition(t).style('opacity', 1)
        .attr('x1', cx).attr('y1', cy)
        .attr('x2', d => ex2(d)).attr('y2', d => ey2(d));
      return l;
    },
    u => {
      u.attr('class', d => `conn conn-${d.id === '__back__' ? 'back' : d.role}`)
       .attr('marker-end', d => connMarker(d));
      u.transition(t)
        .attr('x1', cx).attr('y1', cy)
        .attr('x2', d => ex2(d)).attr('y2', d => ey2(d));
      return u;
    },
    x => x.transition(t).attr('x2', cx).attr('y2', cy).style('opacity', 0).remove()
  );

  // Nodes
  nodeLayer.selectAll('g.node').data(layout, d => d.id).join(
    // ENTER: fade in at target position (emerge from fog in place)
    enter => {
      const g = enter.append('g')
        .attr('class', d => nodeClass(d))
        .attr('transform', d => `translate(${d.x},${d.y})`)
        .style('opacity', 0);
      g.append('circle').attr('class', 'body').attr('r', d => nodeR(d.role));
      g.append('text').attr('class', 'lbl')
        .each(function(d) { applyLabel(d3.select(this), d); });
      g.on('click', onNodeClick);
      g.transition(t).style('opacity', 1);
      return g;
    },
    // UPDATE: smoothly animate position, size, role
    update => {
      update.attr('class', d => nodeClass(d));
      update.select('circle.body').transition(t).attr('r', d => nodeR(d.role));
      update.select('text.lbl')
        .each(function(d) { applyLabel(d3.select(this), d); });
      update.transition(t)
        .attr('transform', d => `translate(${d.x},${d.y})`)
        .style('opacity', 1);
      return update;
    },
    // EXIT: drift outward from new center and fade
    exit => {
      exit.each(function(d) {
        const dx = d.x - cx, dy = d.y - cy;
        const len = Math.hypot(dx, dy) || 1;
        d3.select(this).transition(t)
          .attr('transform', `translate(${d.x + dx/len*55},${d.y + dy/len*55})`)
          .style('opacity', 0).remove();
      });
    }
  );

  requestAnimationFrame(() => {
    nodeLayer.selectAll('.node-back').raise();
    nodeLayer.selectAll('.node-center').raise();
  });
}

// ── Click ─────────────────────────────────────────────────────────────────

function onNodeClick(_ev, d) {
  if (d.role === 'center') {
    window.open(`index.html?c=${encodeURIComponent(d.id)}`, '_blank');
  } else if (d.id === '__back__') {
    navigateTo(resolveAlias(d.backTargetId), d.x, d.y, true);
  } else {
    navigateTo(resolveAlias(d.id));
  }
}

// ── Navigate: camera walks toward the clicked satellite ───────────────────

function navigateTo(targetId, forceX, forceY, isBack = false) {
  if (busy || !conceptIndex[targetId] || targetId === currentId) return;
  busy = true;

  let tx, ty;
  if (forceX !== undefined) {
    tx = forceX; ty = forceY;
  } else {
    const target = nodeLayer.selectAll('g.node').data().find(d => d.id === targetId);
    if (!target) { busy = false; return; }
    tx = target.x; ty = target.y;
  }

  if (isBack) {
    // Restore the came-from direction that was active when we were last at this concept
    const entry = backStack.pop();
    currentCameFrom = entry ? entry.cameFrom : null;
  } else {
    // Save current position in history and compute new came-from direction
    backStack.push({ id: currentId, cameFrom: currentCameFrom });
    const dx = centerX - tx, dy = centerY - ty;
    const len = Math.hypot(dx, dy) || 1;
    currentCameFrom = { x: dx / len, y: dy / len };
  }

  currentId = targetId;
  centerX   = tx; centerY = ty;

  const newLayout = computeLayout(targetId, tx, ty);
  const tr = d3.transition().duration(DUR).ease(d3.easeCubicInOut);
  const k  = d3.zoomTransform(svg.node()).k;

  svg.transition(tr).call(
    zoom.transform,
    d3.zoomIdentity.translate(W / 2 - tx * k, H / 2 - ty * k).scale(k)
  );

  applyLayout(newLayout, tr);
  document.getElementById('nav-app').href      = `index.html?c=${encodeURIComponent(currentId)}`;
  document.getElementById('nav-combined').href = `combined.html?c=${encodeURIComponent(currentId)}`;
  document.getElementById('nav-tree').href     = `tree.html?c=${encodeURIComponent(currentId)}`;
  document.getElementById('nav-learn').href    = `learn.html?c=${encodeURIComponent(currentId)}`;
  setTimeout(() => { busy = false; }, DUR + 50);
}

// ── Keyboard ──────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.key === 'Backspace' || e.key === 'Escape') {
    if (backStack.length === 0) return;
    const backNode = nodeLayer.selectAll('g.node').data().find(d => d.id === '__back__');
    if (backNode) navigateTo(backStack[backStack.length - 1].id, backNode.x, backNode.y, true);
  } else if (e.key === 'Enter') {
    window.open(`index.html?c=${encodeURIComponent(currentId)}`, '_blank');
  }
});

// ── Bootstrap ─────────────────────────────────────────────────────────────

fetch('concepts.json')
  .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
  .then(data => {
    data.concepts.forEach(c => conceptIndex[c.id] = c);
    const startId = new URLSearchParams(location.search).get('c');
    const first = (startId && conceptIndex[startId]) ||
                  data.concepts.find(isFullConcept) || data.concepts[0];
    currentId = first.id; centerX = 0; centerY = 0;
    const tIn = d3.transition().duration(Math.round(DUR * 0.65)).ease(d3.easeCubicOut);
    applyLayout(computeLayout(currentId, 0, 0), tIn);
    document.getElementById('nav-app').href      = `index.html?c=${encodeURIComponent(currentId)}`;
    document.getElementById('nav-combined').href = `combined.html?c=${encodeURIComponent(currentId)}`;
    document.getElementById('nav-tree').href     = `tree.html?c=${encodeURIComponent(currentId)}`;
    document.getElementById('nav-learn').href    = `learn.html?c=${encodeURIComponent(currentId)}`;
  })
  .catch(err => {
    document.body.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100vh;';
    document.body.innerHTML = `<p style="color:#c00">Error: ${err.message}</p>`;
  });
</script>
</body>
</html>
