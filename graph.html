<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept Graph · Commutative Algebra</title>
<script>
(function(){var s=localStorage.getItem('theme'),os=window.matchMedia('(prefers-color-scheme:dark)').matches,dark=s==='dark'||(s===null&&os);if(dark)document.documentElement.classList.add('dm');})();
function toggleTheme(){var dark=document.documentElement.classList.toggle('dm');localStorage.setItem('theme',dark?'dark':'light');if(typeof updateGraph==='function')updateGraph();}
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #d0d0d0; font-family: system-ui, sans-serif; }
#graph { display: block; width: 100%; height: 100%; }

/* ── Edges ── */
.link { fill: none; }
.link-required { stroke: #555; stroke-width: 1.5; opacity: 0.5; }
.link-dimmed   { opacity: 0.04 !important; }
.link-active   { stroke: #1a1a1a; stroke-width: 2.5; opacity: 0.9; }

/* ── Nodes ── */
.node { cursor: pointer; }
.node-full circle { fill: #1a1a1a; stroke: none; }
.node-stub circle { fill: #fff;    stroke: #c0c0c0; stroke-width: 1.5; }
.node-dimmed      { opacity: 0.06 !important; }
.node:hover circle { stroke: #1a1a1a !important; stroke-width: 3 !important; }

/* ── Labels ── */
.lbl {
  text-anchor: middle;
  pointer-events: none;
  font-family: system-ui, sans-serif;
  /* white halo via paint-order so labels read over any background */
  paint-order: stroke;
  stroke: rgba(208, 208, 208, 0.9);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.node-full .lbl { font-size: 10px;   fill: #1a1a1a; }
.node-stub .lbl { font-size: 8.5px;  fill: #777; }

/* ── Legend ── */
#legend {
  position: fixed; bottom: 20px; left: 20px;
  background: rgba(255,255,255,0.93);
  border: 0.5px solid #ddd; border-radius: 10px;
  padding: 12px 16px; line-height: 1;
  font-size: 12px; color: #1a1a1a;
  backdrop-filter: blur(6px); user-select: none;
}
.ltitle { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #888; margin-bottom: 10px; }
.lr  { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.lr:last-child { margin-bottom: 0; }
.lc-full { width: 14px; height: 14px; border-radius: 50%; background: #1a1a1a; flex: none; }
.lc-stub { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #c0c0c0; background: #fff; flex: none; }
.ll-req  { width: 28px; height: 2px; background: #555; flex: none; }

/* ── Hint ── */
#hint {
  position: fixed; bottom: 20px; right: 20px;
  font-size: 11px; color: #aaa;
  background: rgba(255,255,255,0.82);
  padding: 6px 10px; border-radius: 5px;
  backdrop-filter: blur(4px); user-select: none;
}

/* ── View nav ── */
#viewnav {
  position: fixed; top: 14px; right: 16px; z-index: 20;
  display: flex; gap: 7px;
}
.vnav {
  font-size: 12px; padding: 4px 13px; border-radius: 99px;
  border: 0.5px solid #ddd; color: #666; cursor: pointer;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
  text-decoration: none; user-select: none;
}
.vnav:hover { border-color: #555; color: #1a1a1a; }

/* ── Tooltip ── */
#tip {
  position: fixed; pointer-events: none; z-index: 10;
  background: #1a1a1a; color: #fff;
  padding: 5px 10px; border-radius: 5px;
  font-size: 12.5px; white-space: nowrap;
  opacity: 0; transition: opacity 0.1s;
}
button.vnav{cursor:pointer;border:none;font-family:inherit}
#mode-switch{display:flex;border:0.5px solid #ddd;border-radius:99px;overflow:hidden;background:rgba(255,255,255,0.92);backdrop-filter:blur(4px)}
.mode-btn{font-size:12px;padding:4px 14px;border:none;background:none;color:#666;cursor:pointer;font-family:inherit;user-select:none;transition:background .12s,color .12s}
.mode-btn.active{background:#1a1a1a;color:#fff}
.mode-btn:not(.active):hover{color:#1a1a1a}
html.dm #mode-switch{border-color:#2e2e2e;background:rgba(20,20,20,0.92)}
html.dm .mode-btn{color:#aaa}
html.dm .mode-btn.active{background:#e6e6e6;color:#141414}
html.dm .mode-btn:not(.active):hover{color:#e6e6e6}
button.theme-toggle{background:none;backdrop-filter:none;color:#555;padding:4px 6px;display:inline-flex;align-items:center}
button.theme-toggle:hover{background:none;color:#1a1a1a}
html.dm button.theme-toggle{color:#999}
html.dm button.theme-toggle:hover{color:#e6e6e6}
html.dm,html.dm body{background:#0c0c0c}
html.dm .link-required{stroke:#666}
html.dm .node-full circle{fill:#e6e6e6}
html.dm .node-stub circle{fill:#1e1e1e;stroke:#666}
html.dm .node-full .lbl{fill:#e6e6e6}
html.dm .node-stub .lbl{fill:#888}
html.dm .lbl{stroke:rgba(12,12,12,0.9)}
html.dm #legend{background:rgba(20,20,20,0.93);border-color:#2e2e2e;color:#e6e6e6}
html.dm .ltitle{color:#666}
html.dm .lc-full{background:#e6e6e6}
html.dm .lc-stub{border-color:#666;background:#1e1e1e}
html.dm .ll-req{background:#666}
html.dm #hint{color:#666;background:rgba(20,20,20,0.82)}
html.dm .vnav{border-color:#2e2e2e;color:#aaa;background:rgba(20,20,20,0.92)}
html.dm .vnav:hover{border-color:#777;color:#e6e6e6}
html.dm #tip{background:#e6e6e6;color:#141414}
html.dm .link-active{stroke:#e6e6e6}
html.dm .node:hover circle{stroke:#e6e6e6 !important}
html.dm #arr-active path{fill:#e6e6e6}
</style>
</head>
<body>

<svg id="graph"></svg>

<div id="legend">
  <div class="ltitle">Legend</div>
  <div class="lr"><div class="lc-full"></div><span>Full concept</span></div>
  <div class="lr"><div class="lc-stub"></div><span>Stub</span></div>
  <div class="lr"><div class="ll-req"></div><span>Dependency</span></div>
</div>

<div id="hint">Scroll to zoom · Drag to pan · Click node to open in App</div>

<div id="viewnav">
  <div id="mode-switch">
    <button id="mode-learn" class="mode-btn">Learn</button>
    <button id="mode-tree"  class="mode-btn">Tree</button>
  </div>
  <button class="vnav theme-toggle" onclick="toggleTheme()" title="Toggle theme"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></button>
</div>

<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const R_FULL    = 22;   // radius for full concepts
const R_STUB    = 9;    // radius for stubs
const LABEL_MAX = 19;   // truncation length for node labels
let graphMode = localStorage.getItem('graphMode') || 'learn';

function isFullConcept(c) {
  return !!(c.page && Array.isArray(c.page.blocks) && c.page.blocks.length > 0 && !c.stub);
}

function trunc(s, n) {
  return s && s.length > n ? s.slice(0, n - 1) + '…' : (s || '');
}

function nodeR(d) {
  return d.isFull ? R_FULL : R_STUB;
}

// ── Load ─────────────────────────────────────────────────────────────────
fetch('concepts.json')
  .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
  .then(drawGraph)
  .catch(err => {
    document.body.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100vh;';
    document.body.innerHTML = `<p style="color:#c00;font-size:14px">Error loading concepts.json: ${err.message}</p>`;
  });

// ── Topological depth (longest path from roots) ───────────────────────────
// Returns a Map<id, depth> where depth 0 = no prerequisites (root concepts).
function computeDepths(nodes, links) {
  const out   = new Map(nodes.map(n => [n.id, []]));
  const indeg = new Map(nodes.map(n => [n.id, 0]));
  for (const l of links) {
    out.get(l.source).push(l.target);
    indeg.set(l.target, (indeg.get(l.target) || 0) + 1);
  }
  // Kahn's topological sort
  const depth = new Map(nodes.map(n => [n.id, 0]));
  const pq    = nodes.filter(n => indeg.get(n.id) === 0).map(n => n.id);
  const topo  = [];
  while (pq.length) {
    const id = pq.shift();
    topo.push(id);
    for (const child of out.get(id)) {
      indeg.set(child, indeg.get(child) - 1);
      if (indeg.get(child) === 0) pq.push(child);
    }
  }
  // Longest-path depth propagation
  for (const id of topo) {
    for (const child of out.get(id)) {
      if (depth.get(id) + 1 > depth.get(child))
        depth.set(child, depth.get(id) + 1);
    }
  }
  return depth;
}

// ── Build & render ────────────────────────────────────────────────────────
function drawGraph(data) {
  // Aliases are resolved to their canonical concepts — they don't appear as nodes
  const aliasMap = new Map(
    data.concepts.filter(c => c.alias_of).map(c => [c.id, c.alias_of])
  );

  const nodes = data.concepts
    .filter(c => !c.alias_of)
    .map(c => ({ id: c.id, title: c.title, isFull: isFullConcept(c) }));

  const idSet = new Set(nodes.map(n => n.id));

  // One directed edge per required refs[] entry; resolve aliases; skip self-loops and unknowns
  const links = [];
  for (const c of data.concepts) {
    if (c.alias_of) continue;
    for (const ref of c.refs ?? []) {
      if (ref.type !== 'required') continue;
      const srcId = aliasMap.get(ref.id) ?? ref.id;
      if (srcId !== c.id && idSet.has(srcId)) {
        links.push({ source: srcId, target: c.id, type: ref.type });
      }
    }
  }

  const W = window.innerWidth;
  const H = window.innerHeight;

  // Compute topological depth before the simulation resolves link IDs to objects
  const depthMap  = computeDepths(nodes, links);
  const maxDepth  = Math.max(0, ...depthMap.values());

  // Nodes that appear in no edge are unconstrained — don't band them
  const connectedIds = new Set(links.flatMap(l => [l.source, l.target]));

  // Seed positions along depth bands so the simulation starts well-separated
  const margin = H * 0.10;
  nodes.forEach(n => {
    const dep = depthMap.get(n.id) || 0;
    n.x = W / 2 + (Math.random() - 0.5) * Math.min(W * 0.7, 900);
    n.y = maxDepth ? margin + (dep / maxDepth) * (H - 2 * margin) : H / 2;
  });

  const svg = d3.select('#graph').attr('width', W).attr('height', H);
  const g   = svg.append('g');

  // Zoom/pan – wheel + pinch
  svg.call(
    d3.zoom()
      .scaleExtent([0.08, 8])
      .on('zoom', e => g.attr('transform', e.transform))
  );

  // Arrow markers — one for default, one for hover-active state
  const defs = svg.append('defs');
  for (const [id, color] of [['arr', '#888'], ['arr-active', '#1a1a1a']]) {
    defs.append('marker')
      .attr('id',          id)
      .attr('viewBox',     '0 -4 9 8')
      .attr('refX',        9)
      .attr('refY',        0)
      .attr('markerWidth',  6)
      .attr('markerHeight', 6)
      .attr('orient',      'auto')
      .append('path')
        .attr('d',    'M0,-4L9,0L0,4')
        .attr('fill', color);
  }

  // ── Force simulation ───────────────────────────────────────────────────
  const simulation = d3.forceSimulation(nodes)
    .force('link',
      d3.forceLink(links)
        .id(d => d.id)
        .distance(160)
        .strength(0.3)
    )
    .force('charge',
      d3.forceManyBody().strength(d => d.isFull ? -800 : -260)
    )
    .force('center',  d3.forceCenter(W / 2, H / 2).strength(0.02))
    .force('collide', d3.forceCollide().radius(d => nodeR(d) + 38).strength(0.8))
    // Pull connected nodes toward their topological depth band to reduce edge crossings;
    // isolated nodes (no edges) get no pull so repulsion scatters them naturally
    .force('y', d3.forceY(d => {
      const dep = depthMap.get(d.id) || 0;
      return maxDepth ? margin + (dep / maxDepth) * (H - 2 * margin) : H / 2;
    }).strength(d => connectedIds.has(d.id) ? 0.22 : 0));

  // ── Edges ─────────────────────────────────────────────────────────────
  const linkSel = g.append('g')
    .selectAll('line')
    .data(links)
    .join('line')
    .attr('class',      'link link-required')
    .attr('marker-end', 'url(#arr)');

  // ── Nodes ─────────────────────────────────────────────────────────────
  const nodeSel = g.append('g')
    .selectAll('g')
    .data(nodes)
    .join('g')
    .attr('class', d => `node node-${d.isFull ? 'full' : 'stub'}`)
    .call(makeDrag(simulation))
    .on('mouseenter', onEnter)
    .on('mouseleave', onLeave)
    .on('click', (_ev, d) => {
      if (!d.isFull || graphMode === 'tree') {
        window.location.href = `tree.html?c=${encodeURIComponent(d.id)}`;
      } else {
        window.location.href = `learn-visual.html?c=${encodeURIComponent(d.id)}`;
      }
    });

  nodeSel.append('circle').attr('r', d => nodeR(d));

  nodeSel.append('text')
    .attr('class', 'lbl')
    .attr('dy',    d => nodeR(d) + 13)   // just below the circle
    .text(d => trunc(d.title, LABEL_MAX));

  // ── Tick: update positions ─────────────────────────────────────────────
  simulation.on('tick', () => {
    // Draw each edge from source-node-edge to target-node-edge so the
    // arrowhead lands cleanly at the target circle boundary.
    linkSel.each(function(d) {
      const dx  = d.target.x - d.source.x;
      const dy  = d.target.y - d.source.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux  = dx / len;
      const uy  = dy / len;
      const sr  = nodeR(d.source);
      const tr  = nodeR(d.target) + 3;   // 3 px gap so arrow tip sits at edge

      d3.select(this)
        .attr('x1', d.source.x + ux * sr)
        .attr('y1', d.source.y + uy * sr)
        .attr('x2', d.target.x - ux * tr)
        .attr('y2', d.target.y - uy * tr);
    });

    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  // ── Hover: highlight incoming + outgoing edges & connected nodes ────────
  const tip = d3.select('#tip');

  function onEnter(_ev, d) {
    const outTargets = links.filter(l => l.source.id === d.id).map(l => l.target.id);
    const inSources  = links.filter(l => l.target.id === d.id).map(l => l.source.id);
    const connected  = new Set([d.id, ...outTargets, ...inSources]);

    nodeSel.classed('node-dimmed', n => !connected.has(n.id));

    linkSel
      .classed('link-dimmed', l => l.source.id !== d.id && l.target.id !== d.id)
      .classed('link-active', l => l.source.id === d.id || l.target.id === d.id)
      .attr('marker-end', l => (l.source.id === d.id || l.target.id === d.id) ? 'url(#arr-active)' : 'url(#arr)');

    tip.style('opacity', 1).text(d.title);
  }

  function onLeave() {
    nodeSel.classed('node-dimmed', false);
    linkSel.classed('link-dimmed', false).classed('link-active', false)
      .attr('marker-end', 'url(#arr)');
    tip.style('opacity', 0);
  }

  // Tooltip follows the cursor
  svg.on('mousemove', ev => {
    tip
      .style('left', `${ev.clientX + 14}px`)
      .style('top',  `${ev.clientY - 30}px`);
  });
}

// ── Drag behavior ─────────────────────────────────────────────────────────
function makeDrag(sim) {
  return d3.drag()
    .on('start', (ev, d) => {
      if (!ev.active) sim.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    })
    .on('drag', (ev, d) => {
      d.fx = ev.x;
      d.fy = ev.y;
    })
    .on('end', (ev, d) => {
      if (!ev.active) sim.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    });
}

function setMode(m) {
  graphMode = m;
  localStorage.setItem('graphMode', m);
  document.getElementById('mode-learn').classList.toggle('active', m === 'learn');
  document.getElementById('mode-tree').classList.toggle('active',  m === 'tree');
  document.getElementById('hint').textContent =
    m === 'learn'
      ? 'Scroll to zoom · Drag to pan · Click concept → quiz · Click stub → tree'
      : 'Scroll to zoom · Drag to pan · Click node → tree';
}
document.getElementById('mode-learn').addEventListener('click', () => setMode('learn'));
document.getElementById('mode-tree').addEventListener('click',  () => setMode('tree'));
setMode(graphMode);
</script>
</body>
</html>
